name: Feature or connector request
description: Propose a feature, a channel connector or an e-mail provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do that you cannot do today? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Idea, description: How could it work? For a connector or provider, link its API docs. }
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options: [{ label: I would like to build this and send a pull request }]
