<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="E-mail module: sending, events and statistics"><title>E-mail module: sending, events and statistics</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs><rect width="1240" height="600" rx="16" fill="#ffffff" stroke="#d9dee3"/><text x="620" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2933">E-mail module: sending, events and statistics</text><text x="18" y="80" font-size="13" font-weight="700" text-anchor="start" fill="#3B7BE8">SENDING   an approved calendar entry becomes a campaign at the provider</text><rect x="18" y="96" width="188" height="118" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="112.0" y="129.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Calendar entry</text><text x="112.0" y="151.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Title = subject, body =</text><text x="112.0" y="168.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">the text, link gets UTM.</text><text x="112.0" y="184.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Approved by a human</text><text x="112.0" y="201.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">and due.</text><rect x="272" y="96" width="188" height="118" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="366.0" y="129.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">E-mail connector</text><text x="366.0" y="151.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Reads the campaign&#x27;s</text><text x="366.0" y="168.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">target: provider,</text><text x="366.0" y="184.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">audience, sender.</text><text x="366.0" y="201.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Draft first, then send.</text><rect x="526" y="96" width="188" height="118" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="620.0" y="137.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">EmailSender port</text><text x="620.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">Domain: create a draft,</text><text x="620.0" y="176.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">send, status, cancel.</text><text x="620.0" y="193.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">Knows no provider.</text><rect x="780" y="96" width="188" height="118" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="874.0" y="129.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Provider adapter</text><text x="874.0" y="151.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Resend today. One file</text><text x="874.0" y="168.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">per provider; swap it</text><text x="874.0" y="184.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">by changing one</text><text x="874.0" y="201.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">campaign setting.</text><rect x="1034" y="96" width="188" height="118" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="1128.0" y="129.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Provider API</text><text x="1128.0" y="151.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Creates the campaign,</text><text x="1128.0" y="168.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">delivers to the</text><text x="1128.0" y="184.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">audience, keeps the</text><text x="1128.0" y="201.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">lists and unsubscribes.</text><path d="M206 155.0 L272 155.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M460 155.0 L526 155.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M714 155.0 L780 155.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M968 155.0 L1034 155.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="18" y="284" font-size="13" font-weight="700" text-anchor="start" fill="#2E9D5B">TRACKING   opens, clicks, bounces come back and become statistics</text><rect x="1034" y="300" width="188" height="118" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="1128.0" y="333.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Webhooks or polling</text><text x="1128.0" y="355.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Signed events: sent,</text><text x="1128.0" y="372.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">delivered, opened,</text><text x="1128.0" y="388.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">clicked, bounced,</text><text x="1128.0" y="405.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">complained ...</text><rect x="780" y="300" width="188" height="118" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="874.0" y="333.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Provider adapter</text><text x="874.0" y="355.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Verifies the signature,</text><text x="874.0" y="372.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">translates to our one</text><text x="874.0" y="388.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">event format. Keeps no</text><text x="874.0" y="405.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">address or IP.</text><rect x="526" y="300" width="188" height="118" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="620.0" y="333.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Ingest</text><text x="620.0" y="355.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Domain: drops duplicates,</text><text x="620.0" y="372.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">links each event to our</text><text x="620.0" y="388.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">own send record, stores</text><text x="620.0" y="405.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">unknown events raw.</text><rect x="272" y="300" width="188" height="118" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="366.0" y="333.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Postgres</text><text x="366.0" y="355.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">email_send: our record</text><text x="366.0" y="372.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">per campaign.</text><text x="366.0" y="388.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">email_event: append-only,</text><text x="366.0" y="405.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">unique per provider id.</text><rect x="18" y="300" width="188" height="118" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="112.0" y="333.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">Statistics</text><text x="112.0" y="355.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Counts, then the metric</text><text x="112.0" y="372.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">catalog: open, click,</text><text x="112.0" y="388.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">bounce rates...</text><text x="112.0" y="405.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">bb brandwise email stats</text><path d="M1034 359.0 L968 359.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M780 359.0 L714 359.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M526 359.0 L460 359.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M272 359.0 L206 359.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M874.0 214 L874.0 300" fill="none" stroke="#52606d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M1128.0 214 L1128.0 300" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><rect x="18" y="448" width="590" height="92" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="313.0" y="476.25" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Why a provider swap does not break statistics</text><text x="313.0" y="498.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Every send gets our own record; events and reports hang on it, never on</text><text x="313.0" y="515.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">the provider&#x27;s ids. Old sends keep their provider. A report over both</text><text x="313.0" y="531.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">adds them, and a metric only shows what both providers can report.</text><rect x="630" y="448" width="592" height="92" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="926.0" y="476.25" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Rules a provider adapter must meet (shared contract tests)</text><text x="926.0" y="498.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Create drafts only, never send on its own. Reject bad signatures.</text><text x="926.0" y="515.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Declare which events and details it can emit; a metric it cannot</text><text x="926.0" y="531.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">back is shown as n/a, never as 0. Return events without personal data.</text><rect x="18" y="562" width="18" height="14" rx="4" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.4"/><text x="44" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Entry (human approved)</text><rect x="183" y="562" width="18" height="14" rx="4" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.4"/><text x="209" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Domain (provider-free)</text><rect x="348" y="562" width="18" height="14" rx="4" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.4"/><text x="374" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Swappable adapter</text><rect x="513" y="562" width="18" height="14" rx="4" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.4"/><text x="539" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Stored data</text><rect x="678" y="562" width="18" height="14" rx="4" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.4"/><text x="704" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Provider side</text></svg>
