<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 722" width="1240" height="722" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="BrandWise architecture"><title>BrandWise architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs><rect width="1240" height="722" rx="16" fill="#ffffff" stroke="#d9dee3"/><text x="620" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2933">BrandWise architecture</text><rect x="30" y="60" width="270" height="500" rx="14" fill="#EFEAFF" fill-opacity="0.35" stroke="#7357F2" stroke-width="1.2" stroke-dasharray="6 5"/><text x="44" y="82" font-size="13" font-weight="700" fill="#7357F2" letter-spacing="0.5">PEOPLE AND AGENTS</text><rect x="50" y="100" width="230" height="120" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="165.0" y="133.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">You (the owner)</text><text x="165.0" y="156.5" text-anchor="middle" font-size="13" fill="#3e4c59">Plan, review and approve</text><text x="165.0" y="173.5" text-anchor="middle" font-size="13" fill="#3e4c59">in the Calendar page.</text><text x="165.0" y="190.5" text-anchor="middle" font-size="13" fill="#3e4c59">You choose the audience.</text><text x="165.0" y="207.5" text-anchor="middle" font-size="13" fill="#3e4c59">Agents cannot approve.</text><rect x="50" y="250" width="230" height="150" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="165.0" y="290.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Agents</text><text x="165.0" y="313.0" text-anchor="middle" font-size="13" fill="#3e4c59">bb threads (Claude Code).</text><text x="165.0" y="330.0" text-anchor="middle" font-size="13" fill="#3e4c59">&quot;Start agent&quot; in the side panel</text><text x="165.0" y="347.0" text-anchor="middle" font-size="13" fill="#3e4c59">of every page knows which</text><text x="165.0" y="364.0" text-anchor="middle" font-size="13" fill="#3e4c59">page and project you are on.</text><text x="165.0" y="381.0" text-anchor="middle" font-size="13" fill="#3e4c59">Tools only, never credentials.</text><rect x="50" y="430" width="230" height="110" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="165.0" y="467.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Other MCP clients</text><text x="165.0" y="490.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Any MCP client connected</text><text x="165.0" y="506.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">to the instance can run the</text><text x="165.0" y="523.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">same bb brandwise commands.</text><rect x="330" y="60" width="590" height="610" rx="14" fill="#E4EEFF" fill-opacity="0.35" stroke="#3B7BE8" stroke-width="1.2" stroke-dasharray="6 5"/><text x="344" y="82" font-size="13" font-weight="700" fill="#3B7BE8" letter-spacing="0.5">DEDICATED BB INSTANCE</text><rect x="350" y="90" width="550" height="205" rx="14" fill="#E4EEFF" fill-opacity="0.35" stroke="#3B7BE8" stroke-width="1.2" stroke-dasharray="6 5"/><text x="364" y="112" font-size="13" font-weight="700" fill="#3B7BE8" letter-spacing="0.5">BRANDWISE PLUGIN</text><rect x="369" y="120" width="96" height="50" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="417.0" y="151.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Calendar</text><rect x="473" y="120" width="96" height="50" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="521.0" y="151.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Creatives</text><rect x="577" y="120" width="96" height="50" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="625.0" y="151.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Campaigns</text><rect x="681" y="120" width="96" height="50" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="729.0" y="151.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Video</text><rect x="785" y="120" width="96" height="50" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="833.0" y="151.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Settings</text><rect x="369" y="188" width="250" height="90" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="494.0" y="215.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">CLI and MCP: bb brandwise</text><text x="494.0" y="238.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">calendar, campaign, assets,</text><text x="494.0" y="254.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">creative, video, email stats,</text><text x="494.0" y="271.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">product, run-due</text><rect x="631" y="188" width="250" height="90" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="756.0" y="215.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Skills and agent prompts</text><text x="756.0" y="238.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">What an agent may do and</text><text x="756.0" y="254.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">how: one skill for the CLI,</text><text x="756.0" y="271.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">prompts per page and role</text><rect x="350" y="310" width="550" height="62" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="625.0" y="340.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Scheduler: a bb automation, every minute</text><text x="625.0" y="362.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">runs calendar run-due, silent when nothing is due</text><rect x="350" y="388" width="550" height="150" rx="14" fill="#E2F5E9" fill-opacity="0.35" stroke="#2E9D5B" stroke-width="1.2" stroke-dasharray="6 5"/><text x="364" y="410" font-size="13" font-weight="700" fill="#2E9D5B" letter-spacing="0.5">PACKAGES/CORE (NO BB DEPENDENCY)</text><rect x="367" y="420" width="96" height="102" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="415.0" y="470.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Campaigns</text><text x="415.0" y="491.5" text-anchor="middle" font-size="11.5" fill="#3e4c59">base + children</text><rect x="471" y="420" width="96" height="102" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="519.0" y="462.25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Calendar</text><text x="519.0" y="483.75" text-anchor="middle" font-size="11.5" fill="#3e4c59">entries, tiers,</text><text x="519.0" y="499.25" text-anchor="middle" font-size="11.5" fill="#3e4c59">approval</text><rect x="575" y="420" width="96" height="102" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="623.0" y="462.25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Assets</text><text x="623.0" y="483.75" text-anchor="middle" font-size="11.5" fill="#3e4c59">files, hashes,</text><text x="623.0" y="499.25" text-anchor="middle" font-size="11.5" fill="#3e4c59">provenance</text><rect x="679" y="420" width="96" height="102" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="727.0" y="462.25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">Publishing</text><text x="727.0" y="483.75" text-anchor="middle" font-size="11.5" fill="#3e4c59">claim, retry,</text><text x="727.0" y="499.25" text-anchor="middle" font-size="11.5" fill="#3e4c59">connectors</text><rect x="783" y="420" width="96" height="102" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="831.0" y="462.25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">E-mail</text><text x="831.0" y="483.75" text-anchor="middle" font-size="11.5" fill="#3e4c59">events, metrics,</text><text x="831.0" y="499.25" text-anchor="middle" font-size="11.5" fill="#3e4c59">adapters</text><rect x="350" y="556" width="260" height="58" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="480.0" y="584.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Postgres</text><text x="480.0" y="606.5" text-anchor="middle" font-size="12" fill="#3e4c59">campaigns, calendar, events, settings</text><rect x="640" y="556" width="260" height="58" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="770.0" y="584.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">S3 (any S3-compatible)</text><text x="770.0" y="606.5" text-anchor="middle" font-size="12" fill="#3e4c59">creatives, thumbnails, video</text><text x="620" y="646" font-size="12" font-weight="400" text-anchor="middle" fill="#3e4c59">Local stack: Docker (Postgres + S3 emulator). Production: any managed Postgres and S3.</text><rect x="960" y="60" width="250" height="245" rx="14" fill="#E4EEFF" fill-opacity="0.35" stroke="#3B7BE8" stroke-width="1.2" stroke-dasharray="6 5"/><text x="974" y="82" font-size="13" font-weight="700" fill="#3B7BE8" letter-spacing="0.5">PUBLISHING CONNECTORS</text><rect x="978" y="92" width="214" height="58" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1085.0" y="120.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Telegram</text><text x="1085.0" y="142.5" text-anchor="middle" font-size="12" fill="#3e4c59">channel, group or user</text><rect x="978" y="160" width="214" height="80" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1085.0" y="183.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">E-mail</text><text x="1085.0" y="205.5" text-anchor="middle" font-size="12" fill="#3e4c59">Resend today; other providers</text><text x="1085.0" y="221.5" text-anchor="middle" font-size="12" fill="#3e4c59">plug in through one adapter</text><text x="1085.0" y="237.5" text-anchor="middle" font-size="12" fill="#3e4c59">file and pass shared tests</text><rect x="978" y="250" width="214" height="42" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1085.0" y="270.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2933">mock</text><text x="1085.0" y="291.5" text-anchor="middle" font-size="11.5" fill="#3e4c59">for trying the pipeline</text><rect x="960" y="332" width="250" height="92" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="1085.0" y="361.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Outside world</text><text x="1085.0" y="383.5" text-anchor="middle" font-size="12" fill="#3e4c59">Telegram, mailboxes. Signed</text><text x="1085.0" y="399.5" text-anchor="middle" font-size="12" fill="#3e4c59">webhooks come back as events</text><text x="1085.0" y="415.5" text-anchor="middle" font-size="12" fill="#3e4c59">(verified, deduplicated)</text><rect x="960" y="455" width="250" height="190" rx="14" fill="#E4EEFF" fill-opacity="0.35" stroke="#3B7BE8" stroke-width="1.2" stroke-dasharray="6 5"/><text x="974" y="477" font-size="13" font-weight="700" fill="#3B7BE8" letter-spacing="0.5">PROVIDERS (OPTIONAL)</text><rect x="978" y="488" width="214" height="66" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1085.0" y="512.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Image and video generation</text><text x="1085.0" y="534.5" text-anchor="middle" font-size="12" fill="#3e4c59">Higgsfield, with per-call</text><text x="1085.0" y="550.5" text-anchor="middle" font-size="12" fill="#3e4c59">and daily credit limits</text><rect x="978" y="566" width="214" height="66" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1085.0" y="590.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Remotion video engine</text><text x="1085.0" y="612.5" text-anchor="middle" font-size="12" fill="#3e4c59">own licence; Studio is</text><text x="1085.0" y="628.5" text-anchor="middle" font-size="12" fill="#3e4c59">local-only (127.0.0.1)</text><path d="M280 160 L350 160" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="315" y="150" text-anchor="middle" font-size="12" fill="#52606d" font-style="italic">approves</text><path d="M280 325 L350 325" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="315" y="315" text-anchor="middle" font-size="12" fill="#52606d" font-style="italic">CLI / MCP</text><path d="M280 485 L330 485" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M625 296 L625 310" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M625 372 L625 388" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M480 538 L480 556" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M770 538 L770 556" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M900 470 L935 470 L935 180 L960 180" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M935 470 L935 550 L960 550" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="947" y="172" font-size="11" font-weight="400" text-anchor="middle" fill="#52606d">publish</text><path d="M1085 305 L1085 332" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><rect x="30" y="692" width="18" height="14" rx="4" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.4"/><text x="56" y="704" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Human</text><rect x="195" y="692" width="18" height="14" rx="4" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.4"/><text x="221" y="704" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Agent (AI)</text><rect x="360" y="692" width="18" height="14" rx="4" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.4"/><text x="386" y="704" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Code</text><rect x="525" y="692" width="18" height="14" rx="4" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.4"/><text x="551" y="704" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Stored data</text><rect x="690" y="692" width="18" height="14" rx="4" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.4"/><text x="716" y="704" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Outside world</text></svg>
