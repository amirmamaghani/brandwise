<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 672" width="1240" height="672" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="The editor loop: a feedback regulator for e-mail"><title>The editor loop: a feedback regulator for e-mail</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs><rect width="1240" height="672" rx="16" fill="#ffffff" stroke="#d9dee3"/><text x="620" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2933">The editor loop: a feedback regulator for e-mail</text><rect x="30" y="80" width="215" height="130" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="137.5" y="119.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">1  Goals and limits</text><text x="137.5" y="141.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Click rate: a target.</text><text x="137.5" y="158.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Complaints, unsubscribes:</text><text x="137.5" y="174.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">limits. Set by a person,</text><text x="137.5" y="191.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">never by an agent.</text><rect x="275" y="80" width="215" height="130" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="382.5" y="119.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">2  Editor agent</text><text x="382.5" y="141.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">The controller. Reads the</text><text x="382.5" y="158.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">signals and the journal,</text><text x="382.5" y="174.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">picks ONE hypothesis and</text><text x="382.5" y="191.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">hands out the work.</text><rect x="520" y="80" width="215" height="130" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="627.5" y="119.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">3  Author agents</text><text x="627.5" y="141.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Write the variant: a subject</text><text x="627.5" y="158.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">or one slot of a template.</text><text x="627.5" y="174.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">They hand in only that;</text><text x="627.5" y="191.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">the system builds the entry.</text><rect x="765" y="80" width="215" height="130" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="872.5" y="119.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">4  Calendar and scheduler</text><text x="872.5" y="141.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">The same way out as every</text><text x="872.5" y="158.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">e-mail: tier, approval,</text><text x="872.5" y="174.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">run-due, connector.</text><text x="872.5" y="191.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Two arms, two audiences.</text><rect x="1010" y="80" width="200" height="130" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="1110.0" y="119.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">5  Audience</text><text x="1110.0" y="141.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Control (A) and challenger</text><text x="1110.0" y="158.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">(B) go to separate groups,</text><text x="1110.0" y="174.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">so nobody gets both and</text><text x="1110.0" y="191.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">the result has one cause.</text><rect x="1010" y="330" width="200" height="130" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1110.0" y="369.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">6  Events</text><text x="1110.0" y="391.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Opens, clicks, bounces and</text><text x="1110.0" y="408.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">complaints come back from</text><text x="1110.0" y="424.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">the provider, signed and</text><text x="1110.0" y="441.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">deduplicated.</text><rect x="765" y="330" width="215" height="130" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="872.5" y="369.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">7  Statistics and signals</text><text x="872.5" y="391.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Rates with intervals,</text><text x="872.5" y="408.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">smoothed over matured sends.</text><text x="872.5" y="424.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Power: the smallest lift this</text><text x="872.5" y="441.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">audience can show.</text><rect x="520" y="330" width="215" height="130" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="627.5" y="369.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">8  The rails (code)</text><text x="627.5" y="391.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Judge the experiment. The</text><text x="627.5" y="408.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">agent can ask, not overrule.</text><text x="627.5" y="424.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Verdict is final: A, B,</text><text x="627.5" y="441.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">inconclusive or freeze.</text><rect x="275" y="330" width="215" height="130" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="382.5" y="369.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">9  Journal and state</text><text x="382.5" y="391.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">One entry per run, a learning</text><text x="382.5" y="408.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">per conclusion, the incumbent.</text><text x="382.5" y="424.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">The agent&#x27;s only memory</text><text x="382.5" y="441.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">between runs.</text><rect x="30" y="330" width="215" height="130" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="137.5" y="369.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">A person</text><text x="137.5" y="391.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Sets goals and limits,</text><text x="137.5" y="408.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">approves what needs it,</text><text x="137.5" y="424.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">clears a freeze.</text><text x="137.5" y="441.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">Nobody else can.</text><path d="M245 145 L275 145" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M490 145 L520 145" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M735 145 L765 145" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M980 145 L1010 145" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M1110 210 L1110 330" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M1010 395 L980 395" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M765 395 L735 395" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M520 395 L490 395" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M382 330 L382 210" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="365" y="275" text-anchor="middle" font-size="12" fill="#52606d" font-style="italic">reads</text><path d="M137 330 L137 210" fill="none" stroke="#52606d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="275" y="485" width="935" height="105" rx="14" fill="#E4EEFF" fill-opacity="0.35" stroke="#3B7BE8" stroke-width="1.2" stroke-dasharray="6 5"/><text x="289" y="507" font-size="13" font-weight="700" fill="#3B7BE8" letter-spacing="0.5">WHAT THE RAILS ENFORCE (PACKAGES/CORE/SRC/REGULATOR/RAILS.TS)</text><text x="372" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Maturity</text><text x="372" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">judge only data</text><text x="372" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">older than 24 h</text><text x="527" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Minimum sample</text><text x="527" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">200 delivered</text><text x="527" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">per arm</text><text x="682" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Hysteresis</text><text x="682" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">p &lt; 0.05 and a</text><text x="682" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">lift of 10 % or more</text><text x="837" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Cooldown</text><text x="837" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">24 h after</text><text x="837" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">a change</text><text x="992" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">One at a time</text><text x="992" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">one experiment,</text><text x="992" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">one variable</text><text x="1147" y="536" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Guards</text><text x="1147" y="555" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">complaints, unsubscribes:</text><text x="1147" y="570" font-size="11" font-weight="400" text-anchor="middle" fill="#3e4c59">freeze</text><text x="620" y="620" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">The agents steer; code decides. Nothing leaves without the calendar, and nobody but a person sets the goals.</text><rect x="30" y="646" width="18" height="14" rx="4" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.4"/><text x="56" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Human</text><rect x="195" y="646" width="18" height="14" rx="4" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.4"/><text x="221" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Agent (AI)</text><rect x="360" y="646" width="18" height="14" rx="4" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.4"/><text x="386" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Code</text><rect x="525" y="646" width="18" height="14" rx="4" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.4"/><text x="551" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Stored data</text><rect x="690" y="646" width="18" height="14" rx="4" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.4"/><text x="716" y="658" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Outside world</text></svg>
