<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="How a post goes from idea to published and measured"><title>How a post goes from idea to published and measured</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs><rect width="1240" height="560" rx="16" fill="#ffffff" stroke="#d9dee3"/><text x="620" y="38" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2933">How a post goes from idea to published and measured</text><rect x="30" y="92" width="148" height="128" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="104.0" y="138.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">1  Brief</text><text x="104.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">You or a client:</text><text x="104.0" y="177.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">goal, audience,</text><text x="104.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">product facts</text><rect x="204" y="92" width="148" height="128" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="278.0" y="122.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">2  Agent drafts</text><text x="278.0" y="144.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">Writes the text,</text><text x="278.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">makes creatives,</text><text x="278.0" y="177.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">adds a calendar</text><text x="278.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">entry. Never</text><text x="278.0" y="210.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">publishes.</text><rect x="378" y="92" width="148" height="128" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="452.0" y="122.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">3  Calendar entry</text><text x="452.0" y="144.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">Waits as</text><text x="452.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">pending approval.</text><text x="452.0" y="177.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">Tier 1 passes,</text><text x="452.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">tier 2: one click,</text><text x="452.0" y="210.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">tier 3: manual</text><rect x="552" y="92" width="148" height="128" rx="10" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.6"/><text x="626.0" y="130.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">4  Human approval</text><text x="626.0" y="152.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Review, edit,</text><text x="626.0" y="169.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">send back with a</text><text x="626.0" y="185.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">note, approve</text><text x="626.0" y="202.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">or cancel</text><rect x="726" y="92" width="148" height="128" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="800.0" y="122.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">5  Scheduler</text><text x="800.0" y="144.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">bb automation,</text><text x="800.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">every minute:</text><text x="800.0" y="177.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">calendar run-due</text><text x="800.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">takes due, approved</text><text x="800.0" y="210.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">entries</text><rect x="900" y="92" width="148" height="128" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="974.0" y="122.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">6  Connector</text><text x="974.0" y="144.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">Telegram, e-mail,</text><text x="974.0" y="161.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">... publishes.</text><text x="974.0" y="177.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">2 retries, then</text><text x="974.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">Failed. No connector:</text><text x="974.0" y="210.5" text-anchor="middle" font-size="12.5" fill="#3e4c59">Publish by hand</text><rect x="1074" y="92" width="148" height="128" rx="10" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.6"/><text x="1148.0" y="130.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">7  Platform</text><text x="1148.0" y="152.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">The post or</text><text x="1148.0" y="169.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">campaign goes</text><text x="1148.0" y="185.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">out to the</text><text x="1148.0" y="202.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">audience</text><path d="M178 156.0 L204 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M352 156.0 L378 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M526 156.0 L552 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M700 156.0 L726 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M874 156.0 L900 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M1048 156.0 L1074 156.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M626.0 92 L626.0 66 L278.0 66 L278.0 90" fill="none" stroke="#52606d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="452.0" y="58" text-anchor="middle" font-size="12" fill="#52606d" font-style="italic">changes requested: back to the agent with a note</text><rect x="1074" y="330" width="148" height="128" rx="10" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.6"/><text x="1148.0" y="368.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">8  Events</text><text x="1148.0" y="390.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Signed webhooks</text><text x="1148.0" y="407.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">or polling, turned</text><text x="1148.0" y="423.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">into one event</text><text x="1148.0" y="440.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">format, deduplicated</text><rect x="659.0" y="330" width="188" height="128" rx="10" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.6"/><text x="753.0" y="368.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">9  Statistics</text><text x="753.0" y="390.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">Counts and metrics:</text><text x="753.0" y="407.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">clicks, bounces, opens,</text><text x="753.0" y="423.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">unsubscribes. Same</text><text x="753.0" y="440.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">for every provider</text><rect x="204" y="330" width="168" height="128" rx="10" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.6"/><text x="288.0" y="368.25" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2933">10  Next round</text><text x="288.0" y="390.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">The editor agent reads</text><text x="288.0" y="407.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">the numbers, runs an</text><text x="288.0" y="423.75" text-anchor="middle" font-size="12.5" fill="#3e4c59">A/B test within the</text><text x="288.0" y="440.25" text-anchor="middle" font-size="12.5" fill="#3e4c59">rails, briefs authors</text><path d="M1148.0 220 L1148.0 330" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><text x="1158.0" y="279.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d">the audience reacts</text><path d="M1074 394.0 L847.0 394.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M659.0 394.0 L372 394.0" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><path d="M288.0 330 L288.0 222" fill="none" stroke="#52606d" stroke-width="1.8"  marker-end="url(#a)"/><rect x="892" y="238" width="164" height="52" rx="10" fill="#FDE8E8" stroke="#D64545" stroke-width="1.6"/><text x="974.0" y="262.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Failed / Publish by hand</text><text x="974.0" y="284.5" text-anchor="middle" font-size="12" fill="#3e4c59">shown in the Calendar</text><path d="M974.0 220 L974.0 238" fill="none" stroke="#D64545" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="620" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Agents never approve and never publish: the calendar is the only way out.</text><rect x="30" y="518" width="18" height="14" rx="4" fill="#FFF4D9" stroke="#D99A0B" stroke-width="1.4"/><text x="56" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Human</text><rect x="195" y="518" width="18" height="14" rx="4" fill="#EFEAFF" stroke="#7357F2" stroke-width="1.4"/><text x="221" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Agent (AI)</text><rect x="360" y="518" width="18" height="14" rx="4" fill="#E4EEFF" stroke="#3B7BE8" stroke-width="1.4"/><text x="386" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Code</text><rect x="525" y="518" width="18" height="14" rx="4" fill="#E2F5E9" stroke="#2E9D5B" stroke-width="1.4"/><text x="551" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Stored data</text><rect x="690" y="518" width="18" height="14" rx="4" fill="#F0F2F4" stroke="#7D8791" stroke-width="1.4"/><text x="716" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Outside world</text><rect x="855" y="518" width="18" height="14" rx="4" fill="#FDE8E8" stroke="#D64545" stroke-width="1.4"/><text x="881" y="530" font-size="12" font-weight="400" text-anchor="start" fill="#3e4c59">Problem state</text></svg>
